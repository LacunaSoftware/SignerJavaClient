apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'signing'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// The generated sources carry non-ASCII text in their descriptions (for instance
// "Cedula de Identidad" in RuleUserModel). Without this, javac and javadoc read them
// using the platform default charset, which mangles those characters on Windows.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

group = 'com.lacunasoftware.signer'
version = '2.14.0'

base {
    archivesName = 'signer-client'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.swagger.core.v3:swagger-annotations:2.1.1'
    implementation 'com.google.code.gson:gson:2.8.1'
    implementation group: 'org.threeten', name: 'threetenbp', version: '1.4.4'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.10.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.10.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.1'

    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: '2.12.1'

}

java {
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        
            artifactId = "signer-client"
            groupId group
            version version

            pom {
                name = 'signer-client'
                artifactId = 'signer-client'
                description = 'Classes to consume Lacuna Software Signer'
                url = 'https://github.com/LacunaSoftware/SignerJavaClient'

                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }

                scm {
                    connection = 'scm:git:git@github.com:LacunaSoftware/SignerJavaClient.git'
                    developerConnection = 'scm:git:git@github.com:LacunaSoftware/SignerJavaClient.git'
                    url = 'https://github.com/LacunaSoftware/SignerJavaClient'
                }

                developers {
                    developer {
                        id = 'ismaelm'
                        name = 'Ismael Medeiros'
                        email = 'IsmaelM@lacunasoftware.com'
                    }
                    developer {
                        id = "DaniloB"
                        name = "Danilo Bispo"
                        email = "danilob@lacunasoftware.com"
                    }
                }
            }
        }
    }
    repositories {
        // Legacy OSSRH (s01.oss.sonatype.org) was decommissioned, so releases are no
        // longer pushed straight from Gradle. Instead we publish into a local staging
        // layout, zip it, and upload that bundle to the Central Portal. See
        // `centralBundle` below and RELEASING.md.
        maven {
            name = 'centralStaging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

task execute(type:JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'package.Main'
}

// Packs the staged artifacts into the single zip the Central Portal expects.
tasks.register('centralBundle', Zip) {
    dependsOn tasks.named('publishMavenJavaPublicationToCentralStagingRepository')
    from layout.buildDirectory.dir('staging-deploy')
    archiveFileName = "signer-client-${project.version}-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('central')
}

signing {
    sign publishing.publications.mavenJava
}   
